[build]
  base = "app"
  command = "npm run build"
  publish = "dist"

# Proxies API/auth to Render so session cookies stay on tutionlms.netlify.app.
# Name your Render web service "tution-lms-api" or change the hostname below.
[[redirects]]
  from = "/api/*"
  to = "https://tution-lms-api.onrender.com/api/:splat"
  status = 200
  force = true
